<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGPU Particle Simulation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0b1a;
      color: #d0d8f0;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Controls bar ─────────────────────────────────────────────────── */
    #controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 18px;
      padding: 7px 14px;
      background: #10102a;
      border-bottom: 1px solid #222255;
      flex-shrink: 0;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .ctrl-group label {
      font-size: 11px;
      color: #7788bb;
      white-space: nowrap;
    }

    .ctrl-group input[type="number"] {
      width: 70px;
      padding: 3px 6px;
      background: #181832;
      border: 1px solid #334488;
      color: #d0d8f0;
      border-radius: 4px;
      font-size: 12px;
    }
    .ctrl-group input[type="number"]:focus {
      outline: none;
      border-color: #5577ff;
    }

    .ctrl-group input[type="range"] {
      width: 110px;
      accent-color: #4466ee;
      cursor: pointer;
    }

    .val-badge {
      font-size: 11px;
      min-width: 34px;
      color: #99aaee;
    }

    .sep { color: #445; font-size: 12px; }

    button {
      padding: 4px 13px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: filter 0.15s;
    }
    button:hover { filter: brightness(1.25); }

    #addBtn   { background: #2244bb; color: #e8eeff; }
    #resetBtn { background: #553311; color: #ffddaa; }

    .ctrl-group input[type="checkbox"] {
      accent-color: #4466ee;
      cursor: pointer;
      width: 14px;
      height: 14px;
    }

    /* ── Canvas area ──────────────────────────────────────────────────── */
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;
      bottom: 8px;
      left: 10px;
      font-size: 11px;
      color: #556699;
      pointer-events: none;
      user-select: none;
    }

    #fps {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 11px;
      color: #556699;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════ Controls ══════════════════════════════════ -->
<div id="controls">

  <!-- Add particles -->
  <div class="ctrl-group">
    <label for="numInput">Particles to add:</label>
    <input type="number" id="numInput" value="200" min="1" max="10000" step="1">
    <button id="addBtn">Add</button>
  </div>

  <!-- Reset -->
  <div class="ctrl-group">
    <button id="resetBtn">Reset</button>
  </div>

  <!-- World resolution -->
  <div class="ctrl-group">
    <label>World size:</label>
    <input type="number" id="worldW" value="1920" min="100" max="99999" step="10">
    <span class="sep">×</span>
    <input type="number" id="worldH" value="1080" min="100" max="99999" step="10">
  </div>

  <!-- Repulsion slider -->
  <div class="ctrl-group">
    <label for="repulsionSlider">Repulsion:</label>
    <input type="range" id="repulsionSlider" min="0" max="5000" value="1000" step="10">
    <span class="val-badge" id="repulsionBadge">1000</span>
  </div>

  <!-- Restitution slider (collision bounce) -->
  <div class="ctrl-group">
    <label for="restitutionSlider">Restitution:</label>
    <input type="range" id="restitutionSlider" min="0" max="1" value="0.5" step="0.05">
    <span class="val-badge" id="restitutionBadge">0.5</span>
  </div>

  <!-- Viscosity slider -->
  <div class="ctrl-group">
    <label for="viscositySlider">Viscosity:</label>
    <input type="range" id="viscositySlider" min="0" max="0.1" value="0.01" step="0.001">
    <span class="val-badge" id="viscosityBadge">0.01</span>
  </div>

  <!-- Density stiffness slider (SPH pressure) -->
  <div class="ctrl-group">
    <label for="densityStiffnessSlider">Density stiffness:</label>
    <input type="range" id="densityStiffnessSlider" min="0" max="1000" value="100" step="10">
    <span class="val-badge" id="densityStiffnessBadge">100</span>
  </div>

  <!-- Gravity slider -->
  <div class="ctrl-group">
    <label for="gravitySlider">Gravity:</label>
    <input type="range" id="gravitySlider" min="-1000" max="1000" value="0" step="10">
    <span class="val-badge" id="gravityBadge">0</span>
  </div>

  <!-- Cell placement -->
  <div class="ctrl-group">
    <button id="cellBtn" style="background:#225544;color:#aaffcc">Add Cell</button>
  </div>

</div>

<!-- ══════════════════════════ Canvas ═════════════════════════════════════ -->
<div id="canvas-wrap">
  <canvas id="gpuCanvas"></canvas>
  <div id="status">Initializing WebGPU…</div>
  <div id="fps"></div>
</div>

<!-- ══════════════════════════ Script ═════════════════════════════════════ -->
<script>
'use strict';

// ─────────────────────────────────────────────────────────────────────────────
//  Constants
// ─────────────────────────────────────────────────────────────────────────────
const MAX_PARTICLES  = 50_000;
const MAX_GRID_DIM   = 256;          // max grid dimension per axis
const PARTICLE_BYTES = 32;           // vec2f pos + vec2f vel + vec4f color
const UNIFORM_BYTES  = 64;           // Params struct with physics parameters
const HASH_ENTRY_BYTES = 8;          // u32 hash + u32 index

// Spatial hashing parameters
const SMOOTHING_RADIUS = 40.0;       // h for SPH kernel
const GRID_CELL_SIZE = SMOOTHING_RADIUS;
const MAX_NEIGHBORS_PER_CELL = 64;   // For safe lookup bounds

// ─────────────────────────────────────────────────────────────────────────────
//  DOM refs
// ─────────────────────────────────────────────────────────────────────────────
const canvas      = document.getElementById('gpuCanvas');
const statusEl    = document.getElementById('status');
const fpsEl       = document.getElementById('fps');
const numInput    = document.getElementById('numInput');
const worldWInput = document.getElementById('worldW');
const worldHInput = document.getElementById('worldH');
const repulsionSl  = document.getElementById('repulsionSlider');
const repulsionBdg = document.getElementById('repulsionBadge');
const restitutionSl = document.getElementById('restitutionSlider');
const restitutionBdg = document.getElementById('restitutionBadge');
const viscositySl = document.getElementById('viscositySlider');
const viscosityBdg = document.getElementById('viscosityBadge');
const densityStiffnessSl = document.getElementById('densityStiffnessSlider');
const densityStiffnessBdg = document.getElementById('densityStiffnessBadge');
const gravitySl    = document.getElementById('gravitySlider');
const gravityBdg   = document.getElementById('gravityBadge');
const cellBtn      = document.getElementById('cellBtn');

// ─────────────────────────────────────────────────────────────────────────────
//  Live simulation parameters (updated by UI)
// ─────────────────────────────────────────────────────────────────────────────
const sim = {
  worldWidth:    1920,
  worldHeight:   1080,
  gridCols:      64,
  gridRows:      36,
  particleRadius: 8,
  
  // Physics parameters
  repulsion:      1000,   // collision repulsion strength
  restitution:    0.5,    // collision bounce factor
  viscosity:      0.01,   // fluid viscosity
  densityStiffness: 100,  // SPH pressure stiffness
  gravity:        0,      // downward acceleration
  
  // Spatial hashing
  gridCellSize:   GRID_CELL_SIZE,
};

// ─────────────────────────────────────────────────────────────────────────────
//  GPU state
// ─────────────────────────────────────────────────────────────────────────────
let device, context, canvasFormat;
let particleBuf, uniformBuf;
let hashBuf, sortedIndexBuf, cellStartBuf, cellEndBuf;
let hashPipeline, sortPipeline, cellIndexPipeline, updatePipeline, renderPipeline;
let hashBG, sortBG, cellIndexBG, updateBG, renderBG;
let placingCell     = false;

let particleCount = 0;
let lastTs = 0;
let rafId  = null;
let simTime = 0;

// Grid dimensions (computed from world size and cell size)
let gridWidth = 0, gridHeight = 0, gridSize = 0;

// ─────────────────────────────────────────────────────────────────────────────
//  WGSL — Spatial Hashing (compute)
// ─────────────────────────────────────────────────────────────────────────────
const HASH_WGSL = /* wgsl */`

struct Particle { pos: vec2f, vel: vec2f, color: vec4f }
struct HashEntry { hash: u32, index: u32 }

struct Params {
  worldW: f32, worldH: f32,
  gridCols: u32, gridRows: u32,
  gridCellSize: f32, count: u32, dt: f32, time: f32,
  repulsion: f32, restitution: f32, viscosity: f32,
  densityStiffness: f32, gravity: f32, particleRadius: f32,
}

@group(0) @binding(0) var<uniform> params : Params;
@group(0) @binding(1) var<storage, read> pts : array<Particle>;
@group(0) @binding(2) var<storage, read_write> hashBuffer : array<HashEntry>;

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid : vec3u) {
  let idx = gid.x;
  if (idx >= params.count) { return; }

  let pt = pts[idx];
  let cellX = u32(floor(pt.pos.x / params.gridCellSize));
  let cellY = u32(floor(pt.pos.y / params.gridCellSize));

  // Clamp to grid bounds
  let gridX = clamp(cellX, 0u, params.gridCols - 1u);
  let gridY = clamp(cellY, 0u, params.gridRows - 1u);

  let hash = gridX + gridY * params.gridCols;
  hashBuffer[idx] = HashEntry(hash, idx);
}
`;

// ─────────────────────────────────────────────────────────────────────────────
//  WGSL — Bitonic Sort (compute)
// ─────────────────────────────────────────────────────────────────────────────
const SORT_WGSL = /* wgsl */`

struct HashEntry { hash: u32, index: u32 }

@group(0) @binding(0) var<storage, read_write> hashBuffer : array<HashEntry>;

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid : vec3u) {
  let idx = gid.x;
  if (idx >= arrayLength(&hashBuffer)) { return; }

  // Simplified: Single pass bitonic sort stage (would need multiple passes in full implementation)
  // For now, use basic bubble sort approach in compute shader
  for (var i = idx + 1u; i < arrayLength(&hashBuffer); i++) {
    if (hashBuffer[idx].hash > hashBuffer[i].hash) {
      let temp = hashBuffer[idx];
      hashBuffer[idx] = hashBuffer[i];
      hashBuffer[i] = temp;
    }
  }
}
`;

// ─────────────────────────────────────────────────────────────────────────────
//  WGSL — Build Cell Index (compute)
// ─────────────────────────────────────────────────────────────────────────────
const CELL_INDEX_WGSL = /* wgsl */`

struct HashEntry { hash: u32, index: u32 }
struct Params {
  worldW: f32, worldH: f32,
  gridCols: u32, gridRows: u32,
  gridCellSize: f32, count: u32, dt: f32, time: f32,
  repulsion: f32, restitution: f32, viscosity: f32,
  densityStiffness: f32, gravity: f32, particleRadius: f32,
}

@group(0) @binding(0) var<uniform> params : Params;
@group(0) @binding(1) var<storage, read> hashBuffer : array<HashEntry>;
@group(0) @binding(2) var<storage, read_write> cellStart : array<atomic<u32>>;
@group(0) @binding(3) var<storage, read_write> cellEnd : array<atomic<u32>>;

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid : vec3u) {
  let idx = gid.x;
  if (idx >= params.count) { return; }

  let hash = hashBuffer[idx].hash;
  let prevHash = select(0xFFFFFFFFu, hashBuffer[idx - 1u].hash, idx > 0u);

  if (hash != prevHash) {
    atomicStore(&cellStart[hash], idx);
  }

  let nextHash = select(0xFFFFFFFFu, hashBuffer[idx + 1u].hash, idx < params.count - 1u);
  if (hash != nextHash) {
    atomicStore(&cellEnd[hash], idx + 1u);
  }
}
`;

// ─────────────────────────────────────────────────────────────────────────────
//  WGSL — Physics Update (compute)
// ─────────────────────────────────────────────────────────────────────────────
const UPDATE_WGSL = /* wgsl */`
struct Particle { pos: vec2f, vel: vec2f, color: vec4f }
struct HashEntry { hash: u32, index: u32 }

struct Params {
  worldW: f32, worldH: f32,
  gridCols: u32, gridRows: u32,
  gridCellSize: f32, count: u32, dt: f32, time: f32,
  repulsion: f32, restitution: f32, viscosity: f32,
  densityStiffness: f32, gravity: f32, particleRadius: f32,
}

@group(0) @binding(0) var<uniform> params : Params;
@group(0) @binding(1) var<storage, read_write> pts : array<Particle>;
@group(0) @binding(2) var<storage, read> hashBuffer : array<HashEntry>;
@group(0) @binding(3) var<storage, read> cellStart : array<u32>;
@group(0) @binding(4) var<storage, read> cellEnd : array<u32>;

fn getCellIndex(pos: vec2f) -> u32 {
  let cellX = clamp(u32(floor(pos.x / params.gridCellSize)), 0u, params.gridCols - 1u);
  let cellY = clamp(u32(floor(pos.y / params.gridCellSize)), 0u, params.gridRows - 1u);
  return cellX + cellY * params.gridCols;
}

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid : vec3u) {
  let idx = gid.x;
  if (idx >= params.count) { return; }

  var pt = pts[idx];

  let baseCell = getCellIndex(pt.pos);
  let baseX = baseCell % params.gridCols;
  let baseY = baseCell / params.gridCols;

  let radius = params.particleRadius;
  let minDist = radius * 2.0;

  // ─────────────────────────────────────────────
  // Neighbour collision loop (9 surrounding cells)
  // ─────────────────────────────────────────────
  for (var dy: i32 = -1; dy <= 1; dy++) {
    for (var dx: i32 = -1; dx <= 1; dx++) {

      let nx = i32(baseX) + dx;
      let ny = i32(baseY) + dy;

      if (nx < 0 || ny < 0 ||
          nx >= i32(params.gridCols) ||
          ny >= i32(params.gridRows)) {
        continue;
      }

      let neighbourCell = u32(nx) + u32(ny) * params.gridCols;
      let start = cellStart[neighbourCell];
      let end   = cellEnd[neighbourCell];

      // Skip empty cells
      if (start >= end) { continue; }

      for (var j = start; j < end; j++) {

        let otherIndex = hashBuffer[j].index;
        if (otherIndex == idx) { continue; }

        let other = pts[otherIndex];

        let delta = other.pos - pt.pos;
        let dist = length(delta);

        if (dist < minDist && dist > 0.0001) {
          let n = delta / dist;
          let overlap = minDist - dist;

          // Position correction (separate particles)
          pt.pos -= n * overlap * 0.5;

          // Relative velocity along normal
          let relVel = dot(pt.vel - other.vel, n);

          if (relVel < 0.0) {
            let impulse = -(1.0 + params.restitution) * relVel * 0.5;
            pt.vel += n * impulse;
          }
        }
      }
    }
  }

  // ─────────────────────────────────────────────
  // External forces
  // ─────────────────────────────────────────────
  pt.vel.y += params.gravity * params.dt;

  // ─────────────────────────────────────────────
  // Damping (energy loss)
  // ─────────────────────────────────────────────
  pt.vel *= 0.995;

  // ─────────────────────────────────────────────
  // Integrate position
  // ─────────────────────────────────────────────
  pt.pos += pt.vel * params.dt;

  // ─────────────────────────────────────────────
  // Boundary collision (reflection only)
  // ─────────────────────────────────────────────
  let r = radius;

  if (pt.pos.x < r) {
    pt.pos.x = r;
    pt.vel.x *= -params.restitution;
  }

  if (pt.pos.x > params.worldW - r) {
    pt.pos.x = params.worldW - r;
    pt.vel.x *= -params.restitution;
  }

  if (pt.pos.y < r) {
    pt.pos.y = r;
    pt.vel.y *= -params.restitution;
  }

  if (pt.pos.y > params.worldH - r) {
    pt.pos.y = params.worldH - r;
    pt.vel.y *= -params.restitution;
  }

  pts[idx] = pt;
}
`;



// ─────────────────────────────────────────────────────────────────────────────
//  WGSL — Render particles (vertex + fragment)
// ─────────────────────────────────────────────────────────────────────────────
const RENDER_WGSL = /* wgsl */`

struct Particle { pos: vec2f, vel: vec2f, color: vec4f }

struct Params {
  worldW   : f32, worldH   : f32,
  gridCols : u32, gridRows : u32,
  falloff  : f32, force    : f32,
  count    : u32, dt       : f32,
  radius   : f32, repulsion : f32, borderForce : f32, time : f32, gravity : f32,
}

@group(0) @binding(0) var<uniform>       params : Params;
@group(0) @binding(1) var<storage, read> pts    : array<Particle>;

struct VOut {
  @builtin(position) pos   : vec4f,
  @location(0)       uv    : vec2f,
  @location(1)       color : vec4f,
}

// Two-triangle quad corners (triangle-list, 6 vertices)
var<private> QUAD : array<vec2f, 6> = array<vec2f, 6>(
  vec2f(-1.0, -1.0), vec2f( 1.0, -1.0), vec2f(-1.0,  1.0),
  vec2f(-1.0,  1.0), vec2f( 1.0, -1.0), vec2f( 1.0,  1.0),
);

@vertex
fn vs(
  @builtin(vertex_index)   vi : u32,
  @builtin(instance_index) ii : u32,
) -> VOut {
  let corner   = QUAD[vi];
  let pt       = pts[ii];
  let r = params.radius * pt.color.a;
  let worldPos = pt.pos + corner * r;

  // Map world-space → NDC  (y is flipped because world-y grows downward)
  let ndc = vec2f(
     worldPos.x / params.worldW * 2.0 - 1.0,
    -worldPos.y / params.worldH * 2.0 + 1.0,
  );

  var out : VOut;
  out.pos   = vec4f(ndc, 0.0, 1.0);
  out.uv    = corner;
  out.color = pt.color;
  return out;
}

@fragment
fn fs(in : VOut) -> @location(0) vec4f {
  let d = length(in.uv);
  if (d > 1.0) { discard; }

  // Soft anti-aliased rim  (hard centre → transparent edge)
  let alpha = 1.0 - smoothstep(0.65, 1.0, d);

  // Add a specular highlight towards the upper-left
  let lightDir  = normalize(vec2f(-1.0, 1.0));
  let highlight = max(0.0, dot(normalize(in.uv - vec2f(0.4, -0.4)), lightDir)) * 0.35;

  return vec4f(in.color.rgb + highlight, alpha);
}
`;

// ─────────────────────────────────────────────────────────────────────────────
//  WebGPU initialisation
// ─────────────────────────────────────────────────────────────────────────────
async function initGPU() {
  if (!navigator.gpu) {
    throw new Error('WebGPU is not supported in this browser.');
  }
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error('No WebGPU adapter found.');

  device = await adapter.requestDevice();
  device.lost.then(info => {
    setStatus(`GPU device lost: ${info.message}. Please refresh.`);
  });

  canvasFormat = navigator.gpu.getPreferredCanvasFormat();
  context = canvas.getContext('webgpu');
  reconfigureContext();
}

function reconfigureContext() {
  context.configure({ device, format: canvasFormat, alphaMode: 'opaque' });
}

// ─────────────────────────────────────────────────────────────────────────────
//  Buffer creation  (called once; all buffers are pre-allocated to maximum size)
// ─────────────────────────────────────────────────────────────────────────────
function createBuffers() {
  particleBuf = device.createBuffer({
    label: 'particles',
    size:  MAX_PARTICLES * PARTICLE_BYTES,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });

  uniformBuf = device.createBuffer({
    label: 'uniforms',
    size:  UNIFORM_BYTES,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });

  hashBuf = device.createBuffer({
    label: 'hash',
    size:  MAX_PARTICLES * HASH_ENTRY_BYTES,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });

  sortedIndexBuf = device.createBuffer({
    label: 'sortedIndex',
    size:  MAX_PARTICLES * 4,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });

  cellStartBuf = device.createBuffer({
    label: 'cellStart',
    size:  MAX_GRID_DIM * MAX_GRID_DIM * 4,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });

  cellEndBuf = device.createBuffer({
    label: 'cellEnd',
    size:  MAX_GRID_DIM * MAX_GRID_DIM * 4,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
}

// ─────────────────────────────────────────────────────────────────────────────
//  Pipeline creation
// ─────────────────────────────────────────────────────────────────────────────
function createPipelines() {
  const hashMod  = device.createShaderModule({ code: HASH_WGSL });
  const sortMod  = device.createShaderModule({ code: SORT_WGSL });
  const cellIdxMod = device.createShaderModule({ code: CELL_INDEX_WGSL });
  const updateMod = device.createShaderModule({ code: UPDATE_WGSL });
  const renderMod = device.createShaderModule({ code: RENDER_WGSL });

  hashPipeline = device.createComputePipeline({
    layout:  'auto',
    compute: { module: hashMod, entryPoint: 'main' },
  });

  sortPipeline = device.createComputePipeline({
    layout:  'auto',
    compute: { module: sortMod, entryPoint: 'main' },
  });

  cellIndexPipeline = device.createComputePipeline({
    layout:  'auto',
    compute: { module: cellIdxMod, entryPoint: 'main' },
  });

  updatePipeline = device.createComputePipeline({
    layout:  'auto',
    compute: { module: updateMod, entryPoint: 'main' },
  });

  renderPipeline = device.createRenderPipeline({
    layout:   'auto',
    vertex:   { module: renderMod, entryPoint: 'vs' },
    fragment: {
      module:  renderMod,
      entryPoint: 'fs',
      targets: [{
        format: canvasFormat,
        blend: {
          color: {
            srcFactor: 'src-alpha',
            dstFactor: 'one-minus-src-alpha',
            operation: 'add',
          },
          alpha: {
            srcFactor: 'one',
            dstFactor: 'one-minus-src-alpha',
            operation: 'add',
          },
        },
      }],
    },
    primitive: { topology: 'triangle-list' },
  });
}

// ─────────────────────────────────────────────────────────────────────────────
//  Bind-group creation  (only needs to happen once because buffers never change)
// ─────────────────────────────────────────────────────────────────────────────
function createBindGroups() {
  hashBG = device.createBindGroup({
    layout:  hashPipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: uniformBuf } },
      { binding: 1, resource: { buffer: particleBuf } },
      { binding: 2, resource: { buffer: hashBuf } },
    ],
  });

  sortBG = device.createBindGroup({
    layout:  sortPipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: hashBuf } },
    ],
  });

  cellIndexBG = device.createBindGroup({
    layout:  cellIndexPipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: uniformBuf } },
      { binding: 1, resource: { buffer: hashBuf } },
      { binding: 2, resource: { buffer: cellStartBuf } },
      { binding: 3, resource: { buffer: cellEndBuf } },
    ],
  });

  updateBG = device.createBindGroup({
    layout:  updatePipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: uniformBuf } },
      { binding: 1, resource: { buffer: particleBuf } },
      { binding: 2, resource: { buffer: hashBuf } },
      { binding: 3, resource: { buffer: cellStartBuf } },
      { binding: 4, resource: { buffer: cellEndBuf } },
    ],
  });

  renderBG = device.createBindGroup({
    layout:  renderPipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: uniformBuf } },
      { binding: 1, resource: { buffer: particleBuf } },
    ],
  });
}

// ─────────────────────────────────────────────────────────────────────────────
//  Uniform upload
// ─────────────────────────────────────────────────────────────────────────────
const _uniformAB = new ArrayBuffer(UNIFORM_BYTES);
const _uniformDV = new DataView(_uniformAB);

function uploadUniforms(dt) {
  // Update grid dimensions dynamically based on world size and cell size
  sim.gridCols = Math.min(MAX_GRID_DIM, Math.max(1, Math.ceil(sim.worldWidth / sim.gridCellSize)));
  sim.gridRows = Math.min(MAX_GRID_DIM, Math.max(1, Math.ceil(sim.worldHeight / sim.gridCellSize)));

  _uniformDV.setFloat32( 0, sim.worldWidth,         true);
  _uniformDV.setFloat32( 4, sim.worldHeight,        true);
  _uniformDV.setUint32 ( 8, sim.gridCols,           true);
  _uniformDV.setUint32 (12, sim.gridRows,           true);
  _uniformDV.setFloat32(16, sim.gridCellSize,       true);
  _uniformDV.setUint32 (20, particleCount,          true);
  _uniformDV.setFloat32(24, dt,                     true);
  simTime += dt;
  _uniformDV.setFloat32(28, simTime,                true);
  _uniformDV.setFloat32(32, sim.repulsion,          true);
  _uniformDV.setFloat32(36, sim.restitution,        true);
  _uniformDV.setFloat32(40, sim.viscosity,          true);
  _uniformDV.setFloat32(44, sim.densityStiffness,   true);
  _uniformDV.setFloat32(48, sim.gravity,            true);
  _uniformDV.setFloat32(52, sim.particleRadius,     true);
  device.queue.writeBuffer(uniformBuf, 0, _uniformAB);
}

// ─────────────────────────────────────────────────────────────────────────────
//  Particle helpers
// ─────────────────────────────────────────────────────────────────────────────
function hsvToRgb(h, s, v) {
  const i = Math.floor(h * 6);
  const f = h * 6 - i;
  const p = v * (1 - s);
  const q = v * (1 - f * s);
  const t = v * (1 - (1 - f) * s);
  switch (i % 6) {
    case 0: return [v, t, p];
    case 1: return [q, v, p];
    case 2: return [p, v, t];
    case 3: return [p, q, v];
    case 4: return [t, p, v];
    case 5: return [v, p, q];
  }
  // i % 6 is always 0-5; all cases handled above
  return [0, 0, 0];
}

function addParticles(n) {
  const toAdd = Math.min(n, MAX_PARTICLES - particleCount);
  if (toAdd <= 0) {
    setStatus(`Maximum of ${MAX_PARTICLES} particles reached.`);
    return;
  }

  const foodFraction = 0.1;  // 10% are green food particles
  const foodCount = Math.floor(toAdd * foodFraction);

  const f32 = new Float32Array(toAdd * 8);  // 8 floats per particle
  for (let i = 0; i < toAdd; i++) {
    const b = i * 8;
    f32[b + 0] = Math.random() * sim.worldWidth;   // pos.x
    f32[b + 1] = Math.random() * sim.worldHeight;  // pos.y
    f32[b + 2] = 0;                                 // vel.x
    f32[b + 3] = 0;                                 // vel.y
    if (i < foodCount) {
      f32[b + 4] = 0.2;   // green food
      f32[b + 5] = 0.9;
      f32[b + 6] = 0.2;
    } else {
      const [r, g, bl] = hsvToRgb(0.58 + Math.random() * 0.08, 0.7, 0.9);
      f32[b + 4] = r;
      f32[b + 5] = g;
      f32[b + 6] = bl;
    }
    f32[b + 7] = 1;   // color.a
  }

  device.queue.writeBuffer(particleBuf, particleCount * PARTICLE_BYTES, f32.buffer);

  particleCount += toAdd;
  setStatus(`Particles: ${particleCount}`);
}

function resetSim() {
  particleCount = 0;
  simTime = 0;
  // Zero out GPU buffers
  device.queue.writeBuffer(particleBuf, 0, new Uint8Array(MAX_PARTICLES * PARTICLE_BYTES));
  device.queue.writeBuffer(hashBuf, 0, new Uint8Array(MAX_PARTICLES * HASH_ENTRY_BYTES));
  device.queue.writeBuffer(cellStartBuf, 0, new Uint8Array(MAX_GRID_DIM * MAX_GRID_DIM * 4));
  device.queue.writeBuffer(cellEndBuf, 0, new Uint8Array(MAX_GRID_DIM * MAX_GRID_DIM * 4));
  setStatus('Simulation reset.');
}

// ─────────────────────────────────────────────────────────────────────────────
//  Render loop
// ─────────────────────────────────────────────────────────────────────────────
let fpsFrames = 0, fpsAccum = 0;

function frame(ts) {
  const dt = lastTs === 0 ? 1 / 60 : Math.min((ts - lastTs) / 1000, 1 / 20);
  lastTs = ts;

  // FPS counter
  fpsFrames++;
  fpsAccum += dt;
  if (fpsAccum >= 1.0) {
    fpsEl.textContent = `${Math.round(fpsFrames / fpsAccum)} fps`;
    fpsFrames = 0;
    fpsAccum  = 0;
  }

  uploadUniforms(dt);

  const enc = device.createCommandEncoder();

  if (particleCount > 0) {
    // ── Pass 1: Compute particle hashes ───────────────────────────────────
    const hashPass = enc.beginComputePass({ label: 'computeHash' });
    hashPass.setPipeline(hashPipeline);
    hashPass.setBindGroup(0, hashBG);
    hashPass.dispatchWorkgroups(Math.ceil(particleCount / 64));
    hashPass.end();

    // ── Pass 2: Sort particles by hash ────────────────────────────────────
    // TEMP: Disable broken bitonic sort pass until a proper GPU sort is implemented.
    // Accept slower performance for now to guarantee correctness.
    /*
    const sortPass = enc.beginComputePass({ label: 'sortByHash' });
    sortPass.setPipeline(sortPipeline);
    sortPass.setBindGroup(0, sortBG);
    sortPass.dispatchWorkgroups(Math.ceil(particleCount / 64));
    sortPass.end();
    */

    // Reset grid buffers before building cell index to prevent garbage memory bugs
    const gridSize = sim.gridCols * sim.gridRows;
    const clearStartData = new Uint32Array(gridSize).fill(0xFFFFFFFF);
    const clearEndData = new Uint32Array(gridSize).fill(0);
    device.queue.writeBuffer(cellStartBuf, 0, clearStartData.buffer, 0, gridSize * 4);
    device.queue.writeBuffer(cellEndBuf, 0, clearEndData.buffer, 0, gridSize * 4);

    // ── Pass 3: Build cell start/end indices ──────────────────────────────
    const cellIdxPass = enc.beginComputePass({ label: 'buildCellIndex' });
    cellIdxPass.setPipeline(cellIndexPipeline);
    cellIdxPass.setBindGroup(0, cellIndexBG);
    cellIdxPass.dispatchWorkgroups(Math.ceil(particleCount / 64));
    cellIdxPass.end();

    // ── Pass 4: Physics update with neighbor lookup ───────────────────────
    const physicsPass = enc.beginComputePass({ label: 'updatePhysics' });
    physicsPass.setPipeline(updatePipeline);
    physicsPass.setBindGroup(0, updateBG);
    physicsPass.dispatchWorkgroups(Math.ceil(particleCount / 64));
    physicsPass.end();
  }

  // ── Pass 5: Render particles ───────────────────────────────────────────
  const renderPass = enc.beginRenderPass({
    colorAttachments: [{
      view:       context.getCurrentTexture().createView(),
      clearValue: { r: 0.04, g: 0.04, b: 0.10, a: 1.0 },
      loadOp:     'clear',
      storeOp:    'store',
    }],
  });

  if (particleCount > 0) {
    renderPass.setPipeline(renderPipeline);
    renderPass.setBindGroup(0, renderBG);
    // 6 vertices per particle (two-triangle quad)
    renderPass.draw(6, particleCount);
  }

  renderPass.end();

  device.queue.submit([enc.finish()]);

  rafId = requestAnimationFrame(frame);
}

// ─────────────────────────────────────────────────────────────────────────────
//  Canvas resize
// ─────────────────────────────────────────────────────────────────────────────
function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  if (device && context) reconfigureContext();
}

// ─────────────────────────────────────────────────────────────────────────────
//  UI wiring
// ─────────────────────────────────────────────────────────────────────────────
function wireUI() {
  document.getElementById('addBtn').addEventListener('click', () => {
    const n = parseInt(numInput.value, 10);
    if (n > 0) addParticles(n);
  });

  document.getElementById('resetBtn').addEventListener('click', resetSim);

  worldWInput.addEventListener('change', () => {
    sim.worldWidth = Math.max(100, parseInt(worldWInput.value, 10) || 1920);
  });
  worldHInput.addEventListener('change', () => {
    sim.worldHeight = Math.max(100, parseInt(worldHInput.value, 10) || 1080);
  });

  repulsionSl.addEventListener('input', () => {
    sim.repulsion = parseInt(repulsionSl.value, 10);
    repulsionBdg.textContent = repulsionSl.value;
  });

  restitutionSl.addEventListener('input', () => {
    sim.restitution = parseFloat(restitutionSl.value);
    restitutionBdg.textContent = restitutionSl.value;
  });

  viscositySl.addEventListener('input', () => {
    sim.viscosity = parseFloat(viscositySl.value);
    viscosityBdg.textContent = viscositySl.value;
  });

  densityStiffnessSl.addEventListener('input', () => {
    sim.densityStiffness = parseInt(densityStiffnessSl.value, 10);
    densityStiffnessBdg.textContent = densityStiffnessSl.value;
  });

  gravitySl.addEventListener('input', () => {
    sim.gravity = parseInt(gravitySl.value, 10);
    gravityBdg.textContent = gravitySl.value;
  });

  cellBtn.addEventListener('click', () => {
    placingCell = !placingCell;
    cellBtn.style.background = placingCell ? '#44aa77' : '#225544';
    canvas.style.cursor = placingCell ? 'crosshair' : '';
  });

  canvas.addEventListener('click', (e) => {
    if (!placingCell) return;
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const worldX = (px / rect.width)  * sim.worldWidth;
    const worldY = (py / rect.height) * sim.worldHeight;
    window.cellSystem.addCell(worldX, worldY, device, particleBuf, null, particleCount, MAX_PARTICLES, sim);
    placingCell = false;
    cellBtn.style.background = '#225544';
    canvas.style.cursor = '';
  });
}

// ─────────────────────────────────────────────────────────────────────────────
//  Status helper
// ─────────────────────────────────────────────────────────────────────────────
function setStatus(msg) {
  statusEl.textContent = msg;
}

// ─────────────────────────────────────────────────────────────────────────────
//  Entry point
// ─────────────────────────────────────────────────────────────────────────────
(async () => {
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  wireUI();

  try {
    await initGPU();
    createBuffers();
    createPipelines();
    createBindGroups();

    // Seed an initial set of particles so the page is immediately interesting
    addParticles(4000);
    setStatus(`Particles: ${particleCount}  — use the controls above to add more.`);

    rafId = requestAnimationFrame(frame);
  } catch (err) {
    setStatus(`Error: ${err.message}`);
    console.error(err);
  }
})();
</script>
